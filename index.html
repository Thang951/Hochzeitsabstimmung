<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <title>Schuhspiel mit Liveabstimmung</title>
  <style>
    :root{--ink:#403331;--paper:#fffaf2;--rose:#ad5965;--sage:#647b63;--gold:#b69757}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,sans-serif;background:#eee4d6}
    main{min-height:100vh;display:grid;place-items:center;padding:clamp(18px,4vw,54px) 14px;background:linear-gradient(#f4eadde3,#f4eadde3),url('floral-gaeste.webp') center/cover fixed}
    .card{isolation:isolate;position:relative;overflow:hidden;width:min(690px,100%);padding:clamp(42px,7vw,70px);border:1px solid #b6975770;border-radius:34px;background:linear-gradient(145deg,#fffdf8f7,#fff8eef5);box-shadow:0 28px 75px #46362e2c,0 0 0 8px #fffaf28c;text-align:center}.card::before{content:'❦';position:absolute;z-index:-1;top:16px;left:50%;transform:translateX(-50%);color:var(--gold);font:34px Georgia,serif}.card::after{content:'';position:absolute;inset:13px;z-index:-1;border:1px solid #b6975745;border-radius:24px;pointer-events:none}
    .eyebrow{margin:8px 0 18px;color:var(--sage);font-size:.7rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase}h1{margin:0;font:italic 400 clamp(2.45rem,8vw,4.7rem)/.94 Georgia,serif;letter-spacing:-.045em;text-shadow:0 2px 0 #fff}h1 em{color:var(--rose);font-weight:400}.intro{max-width:480px;margin:22px auto 30px;color:#75635f;font:italic 1.2rem/1.5 Georgia,serif}.intro::after{content:'—  ❧  —';display:block;margin-top:12px;color:var(--gold);letter-spacing:.12em}
    .votes{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:10px}.vote{position:relative;isolation:isolate;overflow:hidden;min-height:220px;padding:145px 10px 14px;border:1px solid #f3dfb980;border-radius:24px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font:1.2rem Georgia,serif;box-shadow:0 14px 28px #3d313024,inset 0 0 0 4px #ffffff18;transition:transform .2s,box-shadow .2s}.vote::after{content:'';position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,transparent 48%,#25191a10 62%,#392327d9 100%)}.vote-photo{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}.bride .vote-photo{object-position:center 34%}.groom .vote-photo{object-position:center 35%}.both{grid-column:1/-1;justify-self:center;width:calc(50% - 25px);min-height:190px;padding-top:120px;border-color:#e5ce96;background:#8b7446}.both .vote-photo{object-position:center 38%}.both::after{background:linear-gradient(180deg,transparent 43%,#4c35100d 59%,#5b461bdc 100%)}.vote:hover:not(:disabled){transform:translateY(-5px);box-shadow:0 18px 34px #3d313030,inset 0 0 0 4px #ffffff22}.vote:hover:not(:disabled) .vote-photo{transform:scale(1.035)}.vote:disabled{cursor:default;opacity:.48}.vote.selected{opacity:1;outline:3px solid #d8b86d;outline-offset:3px}.vote-name{font-size:1.18rem;text-shadow:0 2px 8px #000}.vote small{font:700 .58rem Arial,sans-serif;letter-spacing:.1em;margin-top:5px;text-transform:uppercase;opacity:.94;text-shadow:0 2px 6px #000}.or{display:grid;place-items:center;width:40px;height:40px;border:1px solid #b6975760;border-radius:50%;color:#9b766e;background:#fffaf2;font:italic .75rem Georgia,serif}
    .status{margin-top:30px;border-top:1px solid #c9ad7952;padding-top:23px;min-height:78px;color:#887873;font:.92rem/1.55 Georgia,serif}.check{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 10px;border:1px solid #d8b86d;border-radius:50%;background:var(--sage);color:#fff;font-family:Arial,sans-serif;box-shadow:0 5px 12px #647b6335}.status h2{margin:0;color:var(--sage);font-size:1.3rem;font-weight:400}.status p{margin:8px auto 0;max-width:450px}.error{color:#9b3341}.loading{opacity:.7}
    @media(max-width:520px){main{background-position:42% center}.card{border-radius:25px;padding:48px 18px 32px}.votes{grid-template-columns:1fr 1fr;gap:10px}.or{display:none}.vote{min-height:190px;padding:125px 6px 12px}.both{grid-column:1/-1;width:calc(50% - 5px);min-height:170px;padding-top:105px}.vote-name{font-size:1rem}.vote small{font-size:.52rem}.intro{font-size:.96rem}}
  </style>
</head>
<body>
<main><section class="card">
  <p class="eyebrow">Hochzeitsedition</p>
  <h1>Schuhspiel mit<br><em>Liveabstimmung</em></h1>
  <p class="intro">Braut oder Bräutigam?</p>
  <div class="votes" aria-label="Abstimmung">
    <button id="bride" class="vote bride" disabled><img class="vote-photo" src="sarah-button.webp" alt=""><span class="vote-name">Sarah · Braut</span><small>Hier abstimmen</small></button>
    <span class="or">oder</span>
    <button id="groom" class="vote groom" disabled><img class="vote-photo" src="elias-button.webp" alt=""><span class="vote-name">Elias · Bräutigam</span><small>Hier abstimmen</small></button>
    <button id="both" class="vote both" disabled><img class="vote-photo" src="beide-button.webp" alt=""><span class="vote-name">Sarah &amp; Elias</span><small>50 / 50</small></button>
  </div>
  <section id="status" class="status loading" aria-live="polite"><p>Abstimmung wird geladen …</p></section>
</section></main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://rnfyfyuowipepphyixax.supabase.co';
  const SUPABASE_KEY='sb_publishable_I5SDfndlpWO3mNyh3o-4Rw_s2jLL55b';
  const db=createClient(SUPABASE_URL,SUPABASE_KEY);
  const status=document.querySelector('#status');
  const buttons={bride:document.querySelector('#bride'),groom:document.querySelector('#groom'),both:document.querySelector('#both')};
  const deviceKey='hochzeit-device-id';
  const deviceId=localStorage.getItem(deviceKey)||crypto.randomUUID();
  localStorage.setItem(deviceKey,deviceId);
  let roundId=null,choice=null,busy=false;

  function render(){
    Object.entries(buttons).forEach(([name,button])=>{button.disabled=busy||!roundId||!!choice;button.classList.toggle('selected',choice===name);button.querySelector('small').textContent=choice===name?'Deine Wahl':name==='both'?'Beide · 50 / 50':'Hier abstimmen'});
    status.classList.remove('loading');
    if(choice){status.innerHTML='<span class="check">✓</span><h2>Stimme abgegeben!</h2><p>Danke fürs Mitmachen – das Ergebnis siehst du gleich auf der Leinwand.</p>'}
    else if(roundId){status.innerHTML='<p>Deine Auswahl bleibt geheim. Pro Abstimmungsrunde ist eine Stimme möglich.</p>'}
  }
  function fail(message){status.classList.remove('loading');status.innerHTML=`<p class="error">${message}</p>`}

  async function sync(){
    const {data:state,error}=await db.from('game_state').select('round_id').eq('id',1).single();
    if(error||!state){fail('Die Abstimmung ist noch nicht eingerichtet oder momentan nicht erreichbar.');return}
    if(state.round_id!==roundId){roundId=state.round_id;choice=null}
    const {data:own,error:voteError}=await db.from('votes').select('choice').eq('round_id',roundId).eq('device_id',deviceId).maybeSingle();
    if(voteError){fail('Deine Stimme konnte nicht geprüft werden.');return}
    choice=own?.choice||null;render();
  }

  async function vote(selected){
    if(busy||choice||!roundId)return;busy=true;render();
    const {error}=await db.from('votes').insert({round_id:roundId,device_id:deviceId,choice:selected});
    busy=false;
    if(error){await sync();if(!choice)fail('Deine Stimme konnte nicht gespeichert werden. Bitte versuche es erneut.');return}
    choice=selected;render();
  }
  buttons.bride.addEventListener('click',()=>vote('bride'));
  buttons.groom.addEventListener('click',()=>vote('groom'));
  buttons.both.addEventListener('click',()=>vote('both'));
  await sync();setInterval(sync,4000);
</script>
</body>
</html>
