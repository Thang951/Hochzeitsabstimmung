<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <title>Braut oder Bräutigam?</title>
  <style>
    :root{--ink:#3d3130;--paper:#fffaf2;--rose:#b9636d;--sage:#647b63}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 12%,#b9636d22,transparent 28rem),radial-gradient(circle at 90% 85%,#647b6326,transparent 30rem),#f1e9dc;color:var(--ink);font-family:Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:25px 14px}.card{width:min(680px,100%);padding:clamp(34px,7vw,64px);border:1px solid #624b4426;border-radius:34px;background:#fffaf2f7;box-shadow:0 24px 70px #3d313024;text-align:center}
    .eyebrow{margin:0 0 16px;color:var(--sage);font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font:400 clamp(3rem,10vw,5.3rem)/.88 Georgia,serif;letter-spacing:-.055em}h1 em{color:var(--rose);font-weight:400}.intro{max-width:470px;margin:22px auto 30px;color:#746461;font:1.05rem/1.6 Georgia,serif}
    .votes{display:grid;grid-template-columns:1fr 36px 1fr;align-items:center;gap:8px}.vote{min-height:142px;border:0;border-radius:22px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:1.55rem Georgia,serif;box-shadow:0 12px 26px #3d313024;transition:.2s}.vote:hover:not(:disabled){transform:translateY(-4px)}.vote:disabled{cursor:default;opacity:.5}.vote.selected{opacity:1;outline:4px solid #ffffffcc;outline-offset:-8px}.bride{background:linear-gradient(145deg,#c77c84,#a94e5b)}.groom{background:linear-gradient(145deg,#789176,#526b52)}.icon{font-size:1.7rem;margin-bottom:8px}.vote small{font:700 .68rem Arial,sans-serif;letter-spacing:.08em;margin-top:8px;text-transform:uppercase;opacity:.82}.or{color:#9b8b84;font:italic .82rem Georgia,serif}
    .status{margin-top:28px;border-top:1px solid #ded2c7;padding-top:22px;min-height:76px;color:#887873;font: .9rem/1.5 Georgia,serif}.check{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 10px;border-radius:50%;background:var(--sage);color:#fff;font-family:Arial,sans-serif}.status h2{margin:0;color:var(--sage);font-size:1.25rem;font-weight:400}.status p{margin:8px auto 0;max-width:440px}.error{color:#9b3341}.loading{opacity:.7}
    @media(max-width:520px){.card{border-radius:25px;padding:34px 18px 30px}.votes{grid-template-columns:1fr 1fr;gap:10px}.or{display:none}.vote{min-height:125px;font-size:1.3rem}}
  </style>
</head>
<body>
<main><section class="card">
  <p class="eyebrow">Wer kennt das Brautpaar besser?</p>
  <h1>Braut oder<br><em>Bräutigam?</em></h1>
  <p class="intro">Tippe auf deine Antwort. Das gemeinsame Ergebnis erscheint nur auf der Leinwand.</p>
  <div class="votes" aria-label="Abstimmung">
    <button id="bride" class="vote bride" disabled><span class="icon">♕</span><span>Braut</span><small>Hier abstimmen</small></button>
    <span class="or">oder</span>
    <button id="groom" class="vote groom" disabled><span class="icon">♛</span><span>Bräutigam</span><small>Hier abstimmen</small></button>
  </div>
  <section id="status" class="status loading" aria-live="polite"><p>Abstimmung wird geladen …</p></section>
</section></main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://rnfyfyuowipepphyixax.supabase.co';
  const SUPABASE_KEY='sb_publishable_I5SDfndlpWO3mNyh3o-4Rw_s2jLL55b';
  const db=createClient(SUPABASE_URL,SUPABASE_KEY);
  const status=document.querySelector('#status');
  const buttons={bride:document.querySelector('#bride'),groom:document.querySelector('#groom')};
  const deviceKey='hochzeit-device-id';
  const deviceId=localStorage.getItem(deviceKey)||crypto.randomUUID();
  localStorage.setItem(deviceKey,deviceId);
  let roundId=null,choice=null,busy=false;

  function render(){
    Object.entries(buttons).forEach(([name,button])=>{button.disabled=busy||!roundId||!!choice;button.classList.toggle('selected',choice===name);button.querySelector('small').textContent=choice===name?'Deine Wahl':'Hier abstimmen'});
    status.classList.remove('loading');
    if(choice){status.innerHTML='<span class="check">✓</span><h2>Stimme abgegeben!</h2><p>Danke fürs Mitmachen – das Ergebnis siehst du gleich auf der Leinwand.</p>'}
    else if(roundId){status.innerHTML='<p>Deine Auswahl bleibt geheim. Pro Abstimmungsrunde ist eine Stimme möglich.</p>'}
  }
  function fail(message){status.classList.remove('loading');status.innerHTML=`<p class="error">${message}</p>`}

  async function sync(){
    const {data:state,error}=await db.from('game_state').select('round_id').eq('id',1).single();
    if(error||!state){fail('Die Abstimmung ist noch nicht eingerichtet oder momentan nicht erreichbar.');return}
    if(state.round_id!==roundId){roundId=state.round_id;choice=null}
    const {data:own,error:voteError}=await db.from('votes').select('choice').eq('round_id',roundId).eq('device_id',deviceId).maybeSingle();
    if(voteError){fail('Deine Stimme konnte nicht geprüft werden.');return}
    choice=own?.choice||null;render();
  }

  async function vote(selected){
    if(busy||choice||!roundId)return;busy=true;render();
    const {error}=await db.from('votes').insert({round_id:roundId,device_id:deviceId,choice:selected});
    busy=false;
    if(error){await sync();if(!choice)fail('Deine Stimme konnte nicht gespeichert werden. Bitte versuche es erneut.');return}
    choice=selected;render();
  }
  buttons.bride.addEventListener('click',()=>vote('bride'));
  buttons.groom.addEventListener('click',()=>vote('groom'));
  await sync();setInterval(sync,4000);
</script>
</body>
</html>
